services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SECRETS_KEY: ${SECRETS_KEY:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RECEIPTS: ${YOOKASSA_RECEIPTS:-false}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      SELLER_NAME: ${SELLER_NAME:-}
      SELLER_INN: ${SELLER_INN:-}
      SELLER_KPP: ${SELLER_KPP:-}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-}
      SELLER_BANK: ${SELLER_BANK:-}
      SELLER_BIK: ${SELLER_BIK:-}
      SELLER_ACCOUNT: ${SELLER_ACCOUNT:-}
      SELLER_CORR_ACCOUNT: ${SELLER_CORR_ACCOUNT:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADS_AGENT_MODEL: ${ADS_AGENT_MODEL:-claude-opus-5-5}
      YANDEX_DIRECT_API_URL: ${YANDEX_DIRECT_API_URL:-}
      VK_ADS_API_URL: ${VK_ADS_API_URL:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
